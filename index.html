<!DOCTYPE html>
<!-- Це вказує браузеру, що документ написаний у форматі HTML5 -->

<html lang="uk">
<!-- Початок HTML-документу. Атрибут lang="uk" означає, що мова сторінки — українська -->

<head>
  <!-- Розділ "голови" документа, який містить службову інформацію -->
  <meta charset="UTF-8" />
  <!-- Встановлює кодування символів — тут використовується UTF-8, щоб підтримувались українські символи -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- Це для того, щоб сторінка коректно відображалась на мобільних пристроях -->

  <title>Синхронізація часу та статистика</title>
  <!-- Назва сторінки, яка відображається у вкладці браузера -->

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <!-- Підключення шрифтів з Google Fonts (тут використовується Roboto) -->

  <link rel="stylesheet" href="styles.css" />
  <!-- Підключення зовнішнього CSS-файлу зі стилями сторінки -->
</head>

<body>
<!-- Основна частина сторінки — те, що бачить користувач -->

  <div class="main-container">
    <!-- Головний контейнер, який обгортає всю сторінку -->

    <header class="header">
      <!-- Шапка сторінки -->

      <h1>Синхронізація часу</h1>
      <!-- Основний заголовок сторінки -->

      <nav class="tabs">
        <!-- Навігація між вкладками -->

        <button data-tab="sync" class="tab active">Синхронізація</button>
        <!-- Кнопка для переходу на вкладку "Синхронізація" -->

        <button data-tab="stats" class="tab">Статистика</button>
        <!-- Кнопка для переходу на вкладку "Статистика" -->

        <button data-tab="history" class="tab">Історія</button>
        <!-- Кнопка для переходу на вкладку "Історія" -->
      </nav>
    </header>

    <!-- Вкладка: Синхронізація -->
    <section id="sync" class="tab-content active">
      <!-- Секція, яка показується при переході на вкладку "Синхронізація" -->

      <h2>🔄 Виконати синхронізацію</h2>
      <!-- Підзаголовок -->

      <button class="sync-button" onclick="startSync()">Синхронізувати</button>
      <!-- Кнопка, при натисканні на яку запускається функція синхронізації часу -->

      <div class="info-row">
        <!-- Блок, в якому будуть показуватись результати вимірювань -->

        <div>Offset (метод): <span id="timeOffset">–</span> мс</div>
        <!-- Виводиться зміщення часу, яке розраховується власним методом -->

        <div>Offset (timesync): <span id="timeOffsetTS">–</span> мс</div>
        <!-- Зміщення, розраховане за допомогою бібліотеки timesync.js -->

        <div>Помилка: <span id="deltaError">–</span> мс</div>
        <!-- Різниця між двома методами — оцінка точності -->

        <div>З’єднання: <span id="netType">–</span></div>
        <!-- Тип з'єднання (наприклад: Wi-Fi, 4G і т.д.) -->
      </div>

      <div id="syncError" class="sync-error"></div>
      <!-- Місце, де будуть виводитися повідомлення про помилки синхронізації -->
    </section>

    <!-- Вкладка: Статистика -->
    <section id="stats" class="tab-content">
      <!-- Секція для перегляду статистики вимірювань -->

      <h2>📊 Статистика поточних вимірювань</h2>
      <!-- Заголовок розділу -->

      <div class="actions">
        <button onclick="copyMarkdown()">Скопіювати як Markdown</button>
        <!-- Кнопка для копіювання статистики у форматі Markdown (зручно для вставки в звіти або листи) -->
      </div>

      <pre id="statsOutput" class="stats-output">Немає даних</pre>
      <!-- Тут виводиться текстова статистика, зазвичай у вигляді таблиці або списку -->
    </section>

    <!-- Вкладка: Історія -->
    <section id="history" class="tab-content">
      <!-- Секція для перегляду історії вимірювань -->

      <h2>🕓 Історія синхронізацій</h2>
      <!-- Заголовок розділу -->

      <div class="filter-row">
        <!-- Панель фільтрації історії за датами -->

        <label>Від: <input type="date" id="fromDate" onchange="renderHistory()"/></label>
        <!-- Вибір дати початку періоду для фільтрації -->

        <label>До: <input type="date" id="toDate" onchange="renderHistory()"/></label>
        <!-- Вибір дати завершення періоду для фільтрації -->
      </div>

      <table id="historyTable">
        <!-- Таблиця для відображення історії вимірювань -->

        <thead>
          <tr>
            <!-- Заголовки стовпців таблиці -->
            <th>Час</th>
            <th>Offset (Мій)</th>
            <th>Offset (timesync.js)</th>
            <th>Δ помилки</th>
            <th>Тип з’єднання</th>
          </tr>
        </thead>

        <tbody></tbody>
        <!-- Тут динамічно буде підставлятись вміст таблиці з історією -->
      </table>
    </section>
  </div>

  <!-- Підключення зовнішньої JavaScript-бібліотеки для синхронізації часу -->
  <script src="/timesync/timesync.js"></script>

  <!-- Підключення основного JavaScript-файлу, в якому міститься логіка сторінки -->
  <script src="script.js"></script>
</body>
</html>
